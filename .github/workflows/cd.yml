name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci-check:
    name: Run CI steps first
    uses: ./.github/workflows/ci.yml

  build-push:
    name: Build and Push Docker Images
    needs: ci-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, agent]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull for Verification
        run: docker pull ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.sha }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"

      - name: Validate Image Size
        run: |
          IMAGE_TAG=ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.sha }}
          SIZE_BYTES=$(docker image inspect $IMAGE_TAG --format='{{.Size}}')
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "Image size for ${{ matrix.app }}: ${SIZE_MB}MB"

          if [[ "${{ matrix.app }}" == "api" && $SIZE_MB -gt 200 ]]; then
            echo "::error::API image size (${SIZE_MB}MB) exceeds 200MB limit!" && exit 1
          fi
          if [[ "${{ matrix.app }}" == "agent" && $SIZE_MB -gt 20 ]]; then
            echo "::error::Agent image size (${SIZE_MB}MB) exceeds 20MB limit!" && exit 1
          fi



name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_call:

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: edgecloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: 1. Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 2. Typecheck (tsc --noEmit)
        run: pnpm run typecheck

      - name: 3. ESLint (all packages)
        run: pnpm run lint

      - name: 4. Unit tests (all packages, with coverage)
        run: pnpm run test --coverage
        env:
          NODE_ENV: test
          FORCE_MOCK_DB: true
          FORCE_MOCK_REDIS: true

      - name: 5. Database Migration Verification Gate
        run: |
          echo "Checking migration safety..."
          pnpm run validate:migrations

          echo "Deploying migrations to fresh container..."
          pnpm --filter @edgecloud/api exec prisma migrate deploy

          echo "Seeding database..."
          pnpm --filter @edgecloud/api exec prisma db seed

          echo "Running smoke tests against seeded DB..."
          pnpm run test:smoke
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/edgecloud_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          CONFIRM_RISKY_MIGRATION: "true" # In CI we allow it as long as it passed validate

      - name: 6. Integration tests (with Testcontainers)
        run: pnpm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/edgecloud_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

      - name: 7. Contract tests (OpenAPI spec drift check)
        run: |
          # Generate fresh spec
          pnpm --filter @edgecloud/api run gen:openapi
          # Check for drift
          if [ -n "$(git status --porcelain apps/api/openapi.yml)" ]; then
            echo "Error: OpenAPI spec drift detected. Please run 'pnpm --filter @edgecloud/api run gen:openapi' locally."
            git diff apps/api/openapi.yml
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/edgecloud_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-at-least-32-characters-long
          ENCRYPTION_KEY: test-key-at-least-32-characters-long
          NODE_ENV: test

      - name: 8. Dependency graph check (depcruise)
        run: npx depcruise --config .dependency-cruiser.js packages apps

      - name: 9. Build all apps (ensure no build errors)
        run: pnpm run build

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit for critical vulnerabilities
        run: pnpm audit --audit-level critical
        # Fails build on critical CVEs
      - name: Audit for high vulnerabilities (warning only)
        run: pnpm audit --audit-level high || true
        # Informational — does not fail build but logs warnings
      - name: Check for outdated packages
        run: pnpm outdated --recursive || true
        # Informational only

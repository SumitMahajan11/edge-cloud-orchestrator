name: ML Model Retraining

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly at Sunday midnight
  repository_dispatch:
    types: [ml_drift_alert]
  workflow_dispatch: # Manual trigger

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r packages/ml-scheduler/src/training/requirements.txt

      - name: Run Retraining
        run: |
          # Create models directory if it doesn't exist
          mkdir -p packages/ml-scheduler/models
          
          # Default data path for retraining
          DATA_PATH="packages/ml-scheduler/src/training/data/historical_metrics.json"
          
          # If data doesn't exist, create a dummy dataset for CI demonstration if needed
          # In production, this would be fetched from a metrics warehouse
          if [ ! -f "$DATA_PATH" ]; then
            echo "Data not found at $DATA_PATH. Fetching latest metrics..."
            # Placeholder for data fetching logic
            # For now, we expect the data to be present or the job will fail
            exit 1
          fi
          
          python packages/ml-scheduler/src/training/train_model.py "$DATA_PATH" packages/ml-scheduler/models

      - name: Commit and Push New Model
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add packages/ml-scheduler/models/
          git commit -m "chore(ml): update model weights and metadata [semver-skip]" || echo "No changes to commit"
          git push

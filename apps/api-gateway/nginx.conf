events {
    worker_connections 1024;
}

http {
    # Lua package path for request validation
    lua_package_path "/etc/nginx/lua/?.lua;;";

    # Extract user_id from JWT token for per-user rate limiting
    map $http_authorization $user_id {
        default "anonymous";
        "~^Bearer\s+([A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)$" $1;
    }

    # Real IP configuration for accurate rate limiting behind proxies
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    # Extract user_id only for DELETE requests to apply separate rate limiting
    map $request_method $user_id_if_delete {
        default "";
        DELETE $user_id;
    }

    # Rate limiting zones - per-user (extracted from JWT)
    limit_req_zone $user_id zone=user_tasks:10m rate=100r/s;
    limit_req_zone $user_id zone=user_general:10m rate=1000r/s;
    limit_req_zone $user_id_if_delete zone=user_delete:10m rate=50r/s;
    
    # Legacy IP-based rate limiting (fallback)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;

    upstream api {
        least_conn;
        server api:3090;
    }

    # HTTPS server
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name api.edgecloud.io;
        
        # TLS certificates
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        
        # mTLS client certificate verification
        ssl_client_certificate /etc/nginx/ssl/ca.crt;
        ssl_verify_client on;
        
        # Modern TLS configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        
        # HSTS
        add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;

        # Health check
        location /health {
            access_log off;
            return 200 '{"status":"healthy","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }

        # Task validation in production
        location ~ ^/(v[12]/)?tasks {
            # Lua request validation
            access_by_lua_file /etc/nginx/lua/validate_task_request.lua;
            
            # Fallback to v2 if no version is present in the path
            rewrite ^/tasks(.*)$ /v2/tasks$1 break;
            
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Trace-ID $request_id;
            proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
        }

        # Proxy all traffic to API monolith
        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Trace-ID $request_id;
            proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
        }
    }

    # HTTP redirect server
    server {
        listen 80;
        server_name api.edgecloud.io;
        return 301 https://$server_name$request_uri;
    }

    # Development server (HTTP only)
    server {
        listen 80;
        server_name localhost;

        # Health check
        location /health {
            access_log off;
            return 200 '{"status":"healthy","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }

        # Custom error page for rate limiting
        error_page 429 @rate_limit_exceeded;
        location @rate_limit_exceeded {
            default_type text/plain;
            return 429 'Too many requests. Limit exceeded per user rate limit.';
            add_header Content-Type text/plain always;
            add_header Retry-After 60 always;
            add_header X-RateLimit-Limit "100" always;
            add_header X-RateLimit-Reset "60" always;
        }

        # Task operations (creation, update, read, delete) in local dev
        location ~ ^/(api/)?(v[12]/)?tasks {
            # Per-user rate limiting for task operations
            limit_req zone=user_tasks burst=10 nodelay;
            limit_req zone=user_delete burst=5 nodelay;
            limit_req_status 429;
            
            # Lua request validation
            access_by_lua_file /etc/nginx/lua/validate_task_request.lua;
            
            # Strip /api/ prefix if present
            rewrite ^/api/(.*)$ /$1 break;
            # Fallback to v2 if no version is present in the path (e.g. /tasks -> /v2/tasks)
            rewrite ^/tasks(.*)$ /v2/tasks$1 break;
            
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Trace-ID $request_id;
            proxy_set_header X-User-ID $user_id;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # WebSocket (directly to API monolith)
        location /ws {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Trace-ID $request_id;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # SSE Fallback (directly to API monolith)
        location /sse {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Trace-ID $request_id;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }

        # Auth API (backend) - strict rate limiting (IP-based for unauthenticated)
        location ~ ^/api/(v[12]/)?auth/ {
            limit_req zone=auth burst=3 nodelay;
            limit_req_status 429;
            
            rewrite ^/api/auth/(.*)$ /v1/auth/$1 break;
            rewrite ^/api/(v[12]/auth/.*)$ /$1 break;
            
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Trace-ID $request_id;
            proxy_set_header X-User-ID $user_id;
        }

        # General API - per-user rate limiting
        location /api/ {
            # Per-user rate limiting
            limit_req zone=user_general burst=50 nodelay;
            limit_req_status 429;
            
            rewrite ^/api/(.*)$ /$1 break;
            
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Trace-ID $request_id;
            proxy_set_header X-User-ID $user_id;
        }
    }
}

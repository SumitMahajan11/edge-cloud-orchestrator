                      - outputs
                    additionalProperties: false
                  minItems: 1
                edges:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      from:
                        type: string
                      to:
                        type: string
                      condition:
                        type: string
                    required:
                      - id
                      - from
                      - to
                    additionalProperties: false
                variables:
                  type: object
                  additionalProperties: {}
                timeout:
                  type: integer
                  minimum: 1000
                  maximum: 86400000
                  default: 60000
                retryPolicy:
                  type: object
                  properties:
                    maxRetries:
                      type: integer
                      minimum: 0
                      maximum: 10
                      default: 3
                    initialDelay:
                      type: integer
                      minimum: 100
                      default: 1000
                    maxDelay:
                      type: integer
                      minimum: 1000
                      default: 60000
                    multiplier:
                      type: number
                      minimum: 1
                      default: 2
                  additionalProperties: false
              required:
                - name
                - version
                - nodes
                - edges
              additionalProperties: false
        required: true
      responses:

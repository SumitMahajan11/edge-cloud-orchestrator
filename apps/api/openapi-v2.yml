openapi: 3.0.3
info:
  title: Edge-Cloud Orchestrator API
  description: Production API documentation for the Edge-Cloud Orchestrator Control Plane
  version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    def-0:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable error description
        requestId:
          type: string
          description: Unique request ID
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp
        details:
          description: Optional error details
        stack:
          type: string
          description: Error stack trace (non-production only)
      required:
        - code
        - message
        - requestId
        - timestamp
      additionalProperties: false
      title: ErrorSchema
    def-1:
      type: object
      properties:
        status:
          type: string
          enum:
            - healthy
            - degraded
            - unhealthy
        service:
          type: string
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties:
            type: boolean
        version:
          type: string
      required:
        - status
        - service
        - timestamp
      additionalProperties: false
      title: HealthSchema
paths:
  /v2/admin/audit-logs:
    get:
      summary: Get audit logs
      tags:
        - admin
      parameters:
        - schema:
            type: string
          in: query
          name: userId
          required: false
        - schema:
            type: string
          in: query
          name: action
          required: false
        - schema:
            type: number
            default: 100
          in: query
          name: limit
          required: false
      responses:
        "200":
          description: Default Response
  /v2/admin/cleanup:
    post:
      summary: Clean up old data
      tags:
        - admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                olderThanDays:
                  type: number
                types:
                  type: array
                  items:
                    type: string
              required:
                - olderThanDays
                - types
        required: true
      responses:
        "200":
          description: Default Response
  /v2/admin/dlq/events:
    get:
      summary: List DLQ events with filtering
      tags:
        - admin
      parameters:
        - schema:
            type: string
          in: query
          name: topic
          required: false
        - schema:
            type: string
            enum:
              - PENDING
              - RETRYING
              - REPROCESSED
              - PERMANENTLY_FAILED
          in: query
          name: status
          required: false
        - schema:
            type: number
            default: 50
          in: query
          name: limit
          required: false
        - schema:
            type: number
            default: 0
          in: query
          name: offset
          required: false
      responses:
        "200":
          description: Default Response
  /v2/admin/dlq/events/{id}/retry:
    post:
      summary: Retry a specific DLQ event
      tags:
        - admin
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
  /v2/admin/dlq/purge:
    post:
      summary: Purge old DLQ events
      tags:
        - admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                olderThanDays:
                  type: number
                  default: 7
      responses:
        "200":
          description: Default Response
  /v2/admin/dlq/stats:
    get:
      summary: Get DLQ statistics across all streams
      tags:
        - admin
      responses:
        "200":
          description: Default Response
  /v2/admin/health:
    get:
      summary: Get system health
      tags:
        - admin
      responses:
        "200":
          description: Default Response
  /v2/admin/ml/retrain:
    post:
      summary: Trigger ML model retraining
      tags:
        - admin
      responses:
        "200":
          description: Default Response
  /v2/admin/users:
    get:
      summary: List all users
      tags:
        - admin
      responses:
        "200":
          description: Default Response
  /v2/admin/users/{id}/deactivate:
    post:
      summary: Deactivate user
      tags:
        - admin
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
  /v2/admin/users/{id}/role:
    patch:
      summary: Update user role
      tags:
        - admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum:
                    - ADMIN
                    - OPERATOR
                    - VIEWER
              required:
                - role
        required: true
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
  /v2/agents/ca:
    get:
      summary: Get CA certificate
      tags:
        - agents
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificate:
                    type: string
  /v2/agents/certificates/sign:
    post:
      summary: Bootstrap agent certificate and register node
      tags:
        - agents
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - csr
                - bootstrapToken
                - nodeName
                - region
              properties:
                csr:
                  type: string
                  description: PEM encoded Certificate Signing Request
                bootstrapToken:
                  type: string
                  description: One-time bootstrap token
                nodeName:
                  type: string
                region:
                  type: string
                ipAddress:
                  type: string
                port:
                  type: number
                cpuCores:
                  type: number
                memoryGB:
                  type: number
                storageGB:
                  type: number
                hardwareId:
                  type: string
        required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificate:
                    type: string
                  caCertificate:
                    type: string
                  nodeId:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /v2/agents/heartbeat:
    post:
      summary: Agent heartbeat
      tags:
        - agents
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timestamp:
                  type: number
                status:
                  type: string
                metrics:
                  type: object
                  properties:
                    cpu_usage:
                      type: number
                    memory_usage:
                      type: number
      responses:
        "200":
          description: Default Response
  /v2/agents/tasks/pending:
    get:
      summary: Poll for pending tasks
      tags:
        - agents
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string
                  runtime:
                    type: string
                  image:
                    type: string
                  input:
                    type: object
                    additionalProperties: true
                  memory_limit_mb:
                    type: number
                  cpu_fuel:
                    type: number
                    nullable: true
                  timeout_seconds:
                    type: number
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /v2/agents/tasks/{taskId}/result:
    post:
      summary: Report task result
      tags:
        - agents
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - status
                - exit_code
              properties:
                status:
                  type: string
                exit_code:
                  type: number
                stdout:
                  type: string
                stderr:
                  type: string
                duration_ms:
                  type: number
                error:
                  type: string
                  nullable: true
        required: true
      parameters:
        - schema:
            type: string
          in: path
          name: taskId
          required: true
      responses:
        "200":
          description: Default Response
  /v2/alerts/:
    get:
      summary: Get alert history
      tags:
        - alerts
      parameters:
        - schema:
            type: string
            enum:
              - critical
              - warning
              - info
          in: query
          name: severity
          required: false
      responses:
        "200":
          description: Default Response
    delete:
      summary: Clear alert history
      tags:
        - alerts
      responses:
        "200":
          description: Default Response
  /v2/alerts/test:
    post:
      summary: Send test alert
      tags:
        - alerts
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - severity
                - title
                - message
              properties:
                severity:
                  type: string
                  enum:
                    - critical
                    - warning
                    - info
                title:
                  type: string
                message:
                  type: string
        required: true
      responses:
        "200":
          description: Default Response
  /v2/auth/login:
    post:
      summary: Login and get tokens
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
              required:
                - email
                - password
              additionalProperties: false
        required: true
      responses:
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /v2/auth/logout:
    post:
      summary: Logout and invalidate session
      tags:
        - auth
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
  /v2/auth/me:
    get:
      summary: Get current user profile
      tags:
        - auth
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  name:
                    type: string
                  role:
                    type: string
                  createdAt:
                    type: string
                  lastLoginAt:
                    type: string
                    nullable: true
  /v2/auth/refresh:
    post:
      summary: Refresh access token
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 1
              required:
                - refreshToken
              additionalProperties: false
        required: true
      responses:
        "200":
          description: Default Response
  /v2/auth/register:
    post:
      summary: Register a new user
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  allOf:
                    - pattern: "[A-Z]"
                    - pattern: "[a-z]"
                    - pattern: "[0-9]"
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
              required:
                - email
                - password
                - name
              additionalProperties: false
        required: true
      responses:
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /v2/carbon/by-region:
    get:
      summary: Get carbon breakdown by region
      tags:
        - carbon
      responses:
        "200":
          description: Default Response
  /v2/carbon/metrics:
    get:
      summary: Get carbon metrics
      tags:
        - carbon
      parameters:
        - schema:
            type: string
          in: query
          name: region
          required: false
        - schema:
            type: string
            format: date-time
          in: query
          name: from
          required: false
        - schema:
            type: string
            format: date-time
          in: query
          name: to
          required: false
        - schema:
            type: string
            enum:
              - hour
              - day
              - week
              - month
            default: day
          in: query
          name: granularity
          required: false
      responses:
        "200":
          description: Default Response
  /v2/carbon/record:
    post:
      summary: Record carbon metric
      tags:
        - carbon
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nodeId:
                  type: string
                region:
                  type: string
                energyKwh:
                  type: number
                carbonKg:
                  type: number
                renewablePercent:
                  type: number
              required:
                - region
                - energyKwh
                - carbonKg
        required: true
      responses:
        "200":
          description: Default Response
  /v2/carbon/summary:
    get:
      summary: Get carbon footprint summary
      tags:
        - carbon
      responses:
        "200":
          description: Default Response
  /v2/cost/by-node:
    get:
      summary: Get cost breakdown by node
      tags:
        - cost
      responses:
        "200":
          description: Default Response
  /v2/cost/projections:
    get:
      summary: Get cost projections
      tags:
        - cost
      responses:
        "200":
          description: Default Response
  /v2/cost/records:
    get:
      summary: Get cost records
      tags:
        - cost
      parameters:
        - schema:
            type: string
            format: uuid
          in: query
          name: nodeId
          required: false
        - schema:
            type: string
          in: query
          name: resourceType
          required: false
        - schema:
            type: string
            format: date-time
          in: query
          name: from
          required: false
        - schema:
            type: string
            format: date-time
          in: query
          name: to
          required: false
        - schema:
            type: string
            enum:
              - hour
              - day
              - week
              - month
            default: day
          in: query
          name: granularity
          required: false
      responses:
        "200":
          description: Default Response
  /v2/cost/summary:
    get:
      summary: Get cost summary
      tags:
        - cost
      responses:
        "200":
          description: Default Response
  /v2/fl/models:
    get:
      summary: List FL models
      tags:
        - federated-learning
      responses:
        "200":
          description: Default Response
    post:
      summary: Register a FL model
      tags:
        - federated-learning
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                version:
                  type: string
                  pattern: ^\d+\.\d+\.\d+$
                architecture:
                  type: string
                  minLength: 1
                parameters:
                  type: integer
                  minimum: 1
                weightsUrl:
                  type: string
                  format: uri
                weightsSize:
                  type: integer
                  minimum: 0
              required:
                - name
                - version
                - architecture
                - parameters
              additionalProperties: false
        required: true
      responses:
        "200":
          description: Default Response
  /v2/fl/models/{id}:
    get:
      summary: Get FL model
      tags:
        - federated-learning
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
  /v2/fl/models/{id}/weights:
    post:
      summary: Upload weights for a FL model
      tags:
        - federated-learning
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
    get:
      summary: Download weights for a FL model
      tags:
        - federated-learning
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
  /v2/fl/sessions:
    post:
      summary: Start FL training session
      tags:
        - federated-learning
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                modelId:
                  type: string
                  format: uuid
                totalRounds:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 10
                config:
                  type: object
                  properties:
                    minClients:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 3
                    maxClients:
                      type: integer
                      minimum: 1
                      maximum: 1000
                      default: 10
                    localEpochs:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 5
                    learningRate:
                      type: number
                      minimum: 0.0001
                      maximum: 1
                      default: 0.01
                    aggregationStrategy:
                      type: string
                      enum:
                        - fedavg
                        - fedprox
                        - fedadam
                      default: fedavg
                    privacyBudget:
                      type: number
                      minimum: 0
                      maximum: 10
                    noiseMultiplier:
                      type: number
                      minimum: 0
                      maximum: 10
                    gradientClipNorm:
                      type: number
                      minimum: 0
                      maximum: 100
                  additionalProperties: false
              required:
                - modelId
              additionalProperties: false
        required: true
      responses:
        "200":
          description: Default Response
  /v2/fl/sessions/{id}:
    get:
      summary: Get FL session
      tags:
        - federated-learning
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
  /v2/fl/sessions/{id}/stop:
    post:
      summary: Stop FL session
      tags:
        - federated-learning
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
  /v2/logs/:
    get:
      summary: Get system-wide logs
      tags:
        - logs
      parameters:
        - schema:
            type: string
          in: query
          name: taskId
          required: false
        - schema:
            type: string
          in: query
          name: nodeId
          required: false
        - schema:
            type: string
            enum:
              - DEBUG
              - INFO
              - WARN
              - ERROR
          in: query
          name: level
          required: false
        - schema:
            type: number
            default: 100
          in: query
          name: limit
          required: false
        - schema:
            type: number
            default: 0
          in: query
          name: offset
          required: false
      responses:
        "200":
          description: Default Response
  /v2/logs/stats:
    get:
      summary: Get log statistics
      tags:
        - logs
      responses:
        "200":
          description: Default Response
  /v2/metrics/:
    get:
      summary: Get system metrics
      tags:
        - metrics
      responses:
        "200":
          description: Default Response
  /v2/metrics/ml:
    get:
      summary: Get ML-specific metrics
      tags:
        - metrics
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  activeModels:
                    type: number
                  trainingJobs:
                    type: number
                  avgAccuracy:
                    type: number
                  totalPredictions:
                    type: number
  /v2/metrics/network:
    get:
      summary: Get network performance metrics
      tags:
        - metrics
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingressGbps:
                    type: number
                  egressGbps:
                    type: number
                  avgLatency:
                    type: number
                  packetLoss:
                    type: number
  /v2/metrics/nodes:
    get:
      summary: Get node metrics summary
      tags:
        - metrics
      responses:
        "200":
          description: Default Response
  /v2/metrics/prometheus:
    get:
      summary: Get Prometheus metrics
      tags:
        - metrics
      description: Returns metrics in Prometheus exposition format
      responses:
        "200":
          description: Default Response
  /v2/metrics/requests:
    get:
      summary: Get request metrics
      tags:
        - metrics
      responses:
        "200":
          description: Default Response
  /v2/metrics/system:
    get:
      summary: Get system metrics
      tags:
        - metrics
      responses:
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
  /v2/nodes/:
    get:
      summary: List edge nodes
      tags:
        - nodes
      parameters:
        - schema:
            type: string
          in: query
          name: region
          required: false
        - schema:
            type: string
            enum:
              - ONLINE
              - OFFLINE
              - DEGRADED
              - MAINTENANCE
          in: query
          name: status
          required: false
        - schema:
            type: integer
            minimum: 1
            default: 1
          in: query
          name: page
          required: false
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          in: query
          name: limit
          required: false
        - schema:
            type: string
            enum:
              - name
              - region
              - status
              - createdAt
            default: createdAt
          in: query
          name: sortBy
          required: false
        - schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          in: query
          name: sortOrder
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        location:
                          type: string
                        region:
                          type: string
                        status:
                          type: string
                          enum:
                            - ONLINE
                            - OFFLINE
                            - DEGRADED
                            - MAINTENANCE
                        ipAddress:
                          type: string
                        port:
                          type: number
                        specs:
                          type: object
                          properties:
                            cpuCores:
                              type: number
                            memoryGB:
                              type: number
                            storageGB:
                              type: number
                          required:
                            - cpuCores
                            - memoryGB
                            - storageGB
                          additionalProperties: false
                        load:
                          type: object
                          properties:
                            cpuUsage:
                              type: number
                            memoryUsage:
                              type: number
                            activeTasks:
                              type: number
                          required:
                            - activeTasks
                          additionalProperties: false
                        lastHeartbeat:
                          type: string
                          format: date-time
                      required:
                        - id
                        - name
                        - location
                        - region
                        - status
                        - ipAddress
                        - port
                        - specs
                        - lastHeartbeat
                      additionalProperties: false
                  pagination:
                    type: object
                    properties:
                      page:
                        type: number
                      limit:
                        type: number
                      total:
                        type: number
                      totalPages:
                        type: number
    post:
      summary: Register a new edge node
      tags:
        - nodes
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                location:
                  type: string
                  minLength: 1
                  maxLength: 200
                region:
                  type: string
                  minLength: 1
                  maxLength: 50
                ipAddress:

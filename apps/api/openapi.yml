openapi: 3.0.3
info:
  title: Edge-Cloud Orchestrator API
  description: Production API documentation for the Edge-Cloud Orchestrator Control Plane
  version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas: {}
paths:
  /health/redis:
    get:
      responses:
        '200':
          description: Default Response
  /ws:
    get:
      responses:
        '200':
          description: Default Response
  /v1/auth/register:
    post:
      summary: Register a new user
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  allOf:
                    - pattern: '[A-Z]'
                    - pattern: '[a-z]'
                    - pattern: '[0-9]'
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
              required:
                - email
                - password
                - name
              additionalProperties: false
        required: true
      responses:
        '200':
          description: Default Response
  /v1/auth/login:
    post:
      summary: Login and get tokens
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
              required:
                - email
                - password
              additionalProperties: false
        required: true
      responses:
        '200':
          description: Default Response
  /v1/auth/refresh:
    post:
      summary: Refresh access token
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 1
              required:
                - refreshToken
              additionalProperties: false
        required: true
      responses:
        '200':
          description: Default Response
  /v1/auth/logout:
    post:
      summary: Logout and invalidate session
      tags:
        - auth
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
  /v1/auth/me:
    get:
      summary: Get current user profile
      tags:
        - auth
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  name:
                    type: string
                  role:
                    type: string
                  createdAt:
                    type: string
                  lastLoginAt:
                    type: string
                    nullable: true
  /v1/nodes/:
    get:
      summary: List edge nodes
      tags:
        - nodes
      parameters:
        - schema:
            type: string
          in: query
          name: region
          required: false
        - schema:
            type: string
            enum:
              - ONLINE
              - OFFLINE
              - DEGRADED
              - MAINTENANCE
          in: query
          name: status
          required: false
        - schema:
            type: integer
            minimum: 1
            default: 1
          in: query
          name: page
          required: false
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          in: query
          name: limit
          required: false
        - schema:
            type: string
            enum:
              - name
              - region
              - status
              - createdAt
            default: createdAt
          in: query
          name: sortBy
          required: false
        - schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          in: query
          name: sortOrder
          required: false
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        location:
                          type: string
                        region:
                          type: string
                        status:
                          type: string
                          enum:
                            - ONLINE
                            - OFFLINE
                            - DEGRADED
                            - MAINTENANCE
                        ipAddress:
                          type: string
                        port:
                          type: number
                        specs:
                          type: object
                          properties:
                            cpuCores:
                              type: number
                            memoryGB:
                              type: number
                            storageGB:
                              type: number
                          required:
                            - cpuCores
                            - memoryGB
                            - storageGB
                          additionalProperties: false
                        load:
                          type: object
                          properties:
                            cpuUsage:
                              type: number
                            memoryUsage:
                              type: number
                            activeTasks:
                              type: number
                          required:
                            - activeTasks
                          additionalProperties: false
                        lastHeartbeat:
                          type: string
                          format: date-time
                      required:
                        - id
                        - name
                        - location
                        - region
                        - status
                        - ipAddress
                        - port
                        - specs
                        - lastHeartbeat
                      additionalProperties: false
                  pagination:
                    type: object
                    properties:
                      page:
                        type: number
                      limit:
                        type: number
                      total:
                        type: number
                      totalPages:
                        type: number
    post:
      summary: Register a new edge node
      tags:
        - nodes
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                location:
                  type: string
                  minLength: 1
                  maxLength: 200
                region:
                  type: string
                  minLength: 1
                  maxLength: 50
                ipAddress:
                  type: string
                  format: ipv4
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                cpuCores:
                  type: integer
                  minimum: 1
                  maximum: 128
                memoryGB:
                  type: integer
                  minimum: 1
                  maximum: 1024
                storageGB:
                  type: integer
                  minimum: 1
                  maximum: 10000
                costPerHour:
                  type: number
                  minimum: 0
                  maximum: 100
                maxTasks:
                  type: integer
                  minimum: 1
                  maximum: 1000
                bandwidthInMbps:
                  type: integer
                  minimum: 1
                bandwidthOutMbps:
                  type: integer
                  minimum: 1
              required:
                - name
                - location
                - region
                - ipAddress
                - port
                - cpuCores
                - memoryGB
                - storageGB
              additionalProperties: false
        required: true
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  location:
                    type: string
                  region:
                    type: string
                  status:
                    type: string
                    enum:
                      - ONLINE
                      - OFFLINE
                      - DEGRADED
                      - MAINTENANCE
                  ipAddress:
                    type: string
                  port:
                    type: number
                  specs:
                    type: object
                    properties:
                      cpuCores:
                        type: number
                      memoryGB:
                        type: number
                      storageGB:
                        type: number
                    required:
                      - cpuCores
                      - memoryGB
                      - storageGB
                    additionalProperties: false
                  load:
                    type: object
                    properties:
                      cpuUsage:
                        type: number
                      memoryUsage:
                        type: number
                      activeTasks:
                        type: number
                    required:
                      - activeTasks
                    additionalProperties: false
                  lastHeartbeat:
                    type: string
                    format: date-time
                required:
                  - id
                  - name
                  - location
                  - region
                  - status
                  - ipAddress
                  - port
                  - specs
                  - lastHeartbeat
                additionalProperties: false
        '409':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /v1/nodes/{id}:
    get:
      summary: Get node by ID
      tags:
        - nodes
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  location:
                    type: string
                  region:
                    type: string
                  status:
                    type: string
                    enum:
                      - ONLINE
                      - OFFLINE
                      - DEGRADED
                      - MAINTENANCE
                  ipAddress:
                    type: string
                  port:
                    type: number
                  specs:
                    type: object
                    properties:
                      cpuCores:
                        type: number
                      memoryGB:
                        type: number
                      storageGB:
                        type: number
                    required:
                      - cpuCores
                      - memoryGB
                      - storageGB
                    additionalProperties: false
                  load:
                    type: object
                    properties:
                      cpuUsage:
                        type: number
                      memoryUsage:
                        type: number
                      activeTasks:
                        type: number
                    required:
                      - activeTasks
                    additionalProperties: false
                  lastHeartbeat:
                    type: string
                    format: date-time
                required:
                  - id
                  - name
                  - location
                  - region
                  - status
                  - ipAddress
                  - port
                  - specs
                  - lastHeartbeat
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    patch:
      summary: Update node configuration
      tags:
        - nodes
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                location:
                  type: string
                  minLength: 1
                  maxLength: 200
                region:
                  type: string
                  minLength: 1
                  maxLength: 50
                cpuCores:
                  type: integer
                  minimum: 1
                  maximum: 128
                memoryGB:
                  type: integer
                  minimum: 1
                  maximum: 1024
                storageGB:
                  type: integer
                  minimum: 1
                  maximum: 10000
                costPerHour:
                  type: number
                  minimum: 0
                  maximum: 100
                maxTasks:
                  type: integer
                  minimum: 1
                  maximum: 1000
                isMaintenanceMode:
                  type: boolean
              additionalProperties: false
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        '200':
          description: Default Response
    delete:
      summary: Deregister an edge node
      tags:
        - nodes
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        '200':
          description: Default Response
  /v1/nodes/{id}/heartbeat:
    post:
      summary: Receive heartbeat from edge agent
      tags:
        - nodes
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cpuUsage:
                  type: number
                memoryUsage:
                  type: number
                storageUsage:
                  type: number
                latency:
                  type: number
                tasksRunning:
                  type: number
                networkIn:
                  type: number
                networkOut:
                  type: number
              required:
                - cpuUsage
                - memoryUsage
        required: true
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        '200':
          description: Default Response
  /v1/nodes/{id}/metrics:
    get:
      summary: Get node metrics history
      tags:
        - nodes
      parameters:
        - schema:
            type: string
            format: date-time
          in: query
          name: from
          required: false
        - schema:
            type: string
            format: date-time
          in: query
          name: to
          required: false
        - schema:
            type: number
            default: 100
          in: query
          name: limit
          required: false
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        '200':
          description: Default Response
  /v1/nodes/{id}/maintenance:
    post:
      summary: Enable/disable maintenance mode
      tags:
        - nodes
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
              required:
                - enabled
        required: true
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        '200':
          description: Default Response
  /v1/nodes/{id}/scheduling-history:
    get:
      summary: Get scheduling history for a node
      tags:
        - nodes
      parameters:
        - schema:
            type: number
            default: 7
          in: query
          name: days
          required: false
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        '200':
          description: Default Response
  /v1/tasks/:
    get:
      summary: List tasks
      tags:
        - tasks
      parameters:
        - schema:
            type: string
            enum:
              - PENDING
              - SCHEDULED
              - RUNNING
              - COMPLETED
              - FAILED
              - CANCELLED
          in: query
          name: status
          required: false
        - schema:
            type: string
          in: query
          name: type
          required: false
        - schema:
            type: string
            format: uuid
          in: query
          name: nodeId
          required: false
        - schema:
            type: string
            enum:
              - CRITICAL
              - HIGH
              - MEDIUM
              - LOW
          in: query
          name: priority
          required: false
        - schema:
            type: integer
            minimum: 1
            default: 1
          in: query
          name: page
          required: false
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          in: query
          name: limit
          required: false
        - schema:
            type: string
            enum:
              - submittedAt
              - priority
              - status
              - duration
              - createdAt
              - updatedAt
              - name
            default: submittedAt
          in: query
          name: sortBy
          required: false
        - schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          in: query
          name: sortOrder
          required: false
        - schema:
            type: string
            format: date-time
          in: query
          name: from
          required: false
        - schema:
            type: string
            format: date-time
          in: query
          name: to
          required: false
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        type:
                          type: string
                        status:
                          type: string
                          enum:
                            - PENDING
                            - SCHEDULED
                            - RUNNING
                            - COMPLETED
                            - FAILED
                            - CANCELLED
                        priority:
                          type: string
                        nodeId:
                          anyOf:
                            - anyOf:
                                - not: {}
                                - type: string
                                  format: uuid
                            - type: 'null'
                        submittedAt:
                          type: string
                          format: date-time
                        startedAt:
                          anyOf:
                            - anyOf:
                                - not: {}
                                - type: string
                                  format: date-time
                            - type: 'null'
                        completedAt:
                          anyOf:
                            - anyOf:
                                - not: {}
                                - type: string
                                  format: date-time
                            - type: 'null'
                        error:
                          anyOf:
                            - anyOf:
                                - not: {}
                                - type: string
                            - type: 'null'
                        metadata:
                          type: object
                          additionalProperties: {}
                      required:
                        - id
                        - name
                        - type
                        - status
                        - priority
                        - submittedAt
                      additionalProperties: false
                  pagination:
                    type: object
                    properties:
                      page:
                        type: number
                      limit:
                        type: number
                      total:
                        type: number
                      totalPages:
                        type: number
    post:
      summary: Create and schedule a new task
      tags:
        - tasks
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                type:
                  type: string
                  enum:
                    - IMAGE_CLASSIFICATION
                    - DATA_AGGREGATION
                    - MODEL_INFERENCE
                    - SENSOR_FUSION
                    - VIDEO_PROCESSING
                    - LOG_ANALYSIS
                    - ANOMALY_DETECTION
                    - DATA_PROCESSING
                    - ETL_PIPELINE
                    - ML_TRAINING
                    - NLP
                    - COMPUTER_VISION
                    - SPEECH_RECOGNITION
                    - RECOMMENDATION_ENGINE
                    - FRAUD_DETECTION
                    - IOT_DATA_INGESTION
                    - REALTIME_ANALYTICS
                    - BATCH_PROCESSING
                    - CONTAINER_BUILD
                    - CICD_PIPELINE
                    - CUSTOM
                priority:
                  type: string
                  enum:
                    - CRITICAL
                    - HIGH
                    - MEDIUM
                    - LOW
                  default: MEDIUM
                target:
                  type: string
                  enum:
                    - EDGE
                    - CLOUD
                    - HYBRID
                  default: EDGE
                nodeId:
                  type: string
                  format: uuid
                input:
                  type: object
                  additionalProperties: {}
                metadata:
                  type: object
                  additionalProperties: {}
                maxRetries:
                  type: integer
                  minimum: 0
                  maximum: 10
                  default: 3
              required:
                - name
                - type
              additionalProperties: false
        required: true
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  type:
                    type: string
                  status:
                    type: string
                    enum:
                      - PENDING
                      - SCHEDULED
                      - RUNNING
                      - COMPLETED
                      - FAILED
                      - CANCELLED
                  priority:
                    type: string
                  nodeId:
                    anyOf:
                      - anyOf:
                          - not: {}
                          - type: string
                            format: uuid
                      - type: 'null'
                  submittedAt:
                    type: string
                    format: date-time
                  startedAt:
                    anyOf:
                      - anyOf:
                          - not: {}
                          - type: string
                            format: date-time
                      - type: 'null'
                  completedAt:
                    anyOf:
                      - anyOf:
                          - not: {}
                          - type: string
                            format: date-time
                      - type: 'null'
                  error:
                    anyOf:
                      - anyOf:
                          - not: {}
                          - type: string
                      - type: 'null'
                  metadata:
                    type: object
                    additionalProperties: {}
                required:
                  - id
                  - name
                  - type
                  - status
                  - priority
                  - submittedAt
                additionalProperties: false
        '409':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /v1/tasks/{id}:
    get:
      summary: Get task by ID
      tags:
        - tasks
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  type:
                    type: string
                  status:
                    type: string
                    enum:
                      - PENDING
                      - SCHEDULED
                      - RUNNING
                      - COMPLETED
                      - FAILED
                      - CANCELLED
                  priority:
                    type: string
                  nodeId:
                    anyOf:
                      - anyOf:
                          - not: {}
                          - type: string
                            format: uuid
                      - type: 'null'
                  submittedAt:
                    type: string
                    format: date-time
                  startedAt:
                    anyOf:
                      - anyOf:
                          - not: {}
                          - type: string
                            format: date-time
                      - type: 'null'
                  completedAt:
                    anyOf:
                      - anyOf:
                          - not: {}
                          - type: string
                            format: date-time
                      - type: 'null'
                  error:
                    anyOf:
                      - anyOf:
                          - not: {}
                          - type: string
                      - type: 'null'
                  metadata:
                    type: object
                    additionalProperties: {}
                required:
                  - id
                  - name
                  - type
                  - status
                  - priority
                  - submittedAt
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /v1/tasks/{id}/scheduling-decision:
    get:
      summary: Get scheduling decision for a task
      tags:
        - tasks
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        '200':
          description: Default Response
  /v1/tasks/{id}/cancel:
    post:
      summary: Cancel a task
      tags:
        - tasks
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        '200':
          description: Default Response
  /v1/tasks/{id}/retry:
    post:
      summary: Retry a failed task
      tags:
        - tasks
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        '200':
          description: Default Response
  /v1/tasks/{id}/logs:
    get:
      summary: Get task logs
      tags:
        - tasks
      parameters:
        - schema:
            type: string
          in: query
          name: level
          required: false
        - schema:
            type: number
            default: 100
          in: query
          name: limit
          required: false
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        '200':
          description: Default Response
  /v1/tasks/stats:
    get:
      summary: Get task statistics (Deprecated)
      tags:
        - tasks
      responses:
        '200':
          description: Default Response
  /v1/workflows/:
    get:
      summary: List workflows
      tags:
        - workflows
      responses:
        '200':
          description: Default Response
    post:
      summary: Create a new workflow
      tags:
        - workflows
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                version:
                  type: string
                  pattern: ^\d+\.\d+\.\d+$
                nodes:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      type:
                        type: string
                        enum:
                          - task
                          - decision
                          - parallel
                          - wait
                          - subworkflow
                      config:
                        type: object
                        additionalProperties: {}
                      inputs:
                        type: array
                        items:
                          type: string
                      outputs:
                        type: array
                        items:
                          type: string
                    required:
                      - id
                      - name
                      - type
                      - config
                      - inputs
                      - outputs
                    additionalProperties: false
                  minItems: 1
                edges:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      from:
                        type: string
                      to:
                        type: string
                      condition:
                        type: string
                    required:
                      - id
                      - from
                      - to
                    additionalProperties: false
                variables:
                  type: object
                  additionalProperties: {}
                timeout:
                  type: integer
                  minimum: 1000
                  maximum: 86400000
                  default: 60000
                retryPolicy:
                  type: object
                  properties:
                    maxRetries:
                      type: integer
                      minimum: 0
                      maximum: 10
                      default: 3
                    initialDelay:
                      type: integer
                      minimum: 100
                      default: 1000
                    maxDelay:
                      type: integer
                      minimum: 1000
                      default: 60000

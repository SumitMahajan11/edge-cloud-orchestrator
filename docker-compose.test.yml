version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edgecloud_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d edgecloud_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://test:test@postgres:5432/edgecloud_test
      REDIS_URL: redis://redis:6379
      JWT_SECRET: test-secret-must-be-32-chars-minimum-length-for-hmac
      ENCRYPTION_KEY: test-encryption-key-must-be-32-chars
      NODE_ENV: test
      LOG_LEVEL: debug
      PORT: 3090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3090:3090"

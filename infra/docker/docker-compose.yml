services:
  postgres-primary:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edgecloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: edgecloud
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=3
      -c wal_keep_size=64
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgecloud"]
      interval: 5s
    networks:
      - edgecloud

  postgres-replica:
    image: postgres:16-alpine
    environment:
      PGUSER: replicator
      PGPASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    command: >
      bash -c "
      until pg_basebackup -h postgres-primary -U replicator
        -D /var/lib/postgresql/data -P -Xs -R; do
        echo 'Waiting for primary...'; sleep 2;
      done && postgres"
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - edgecloud
  pgbouncer:
    image: public.ecr.aws/bitnami/pgbouncer:latest
    environment:
      - PGBOUNCER_DATABASE_HOST=postgres-primary
      - PGBOUNCER_DATABASE_PORT=5432
      - PGBOUNCER_DATABASE_USER=edgecloud
      - PGBOUNCER_DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - PGBOUNCER_DATABASE_NAME=edgecloud
      - PGBOUNCER_PORT=5432
      - PGBOUNCER_POOL_MODE=transaction
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - postgres-primary
    networks:
      - edgecloud
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - edgecloud
  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    ports:
      - 29092:29092
    networks:
      - edgecloud
  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    networks:
      - edgecloud
  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    networks:
      - edgecloud
  backend:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      network: host

    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@pgbouncer:5432/edge_cloud?schema=public
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      REDIS_SENTINELS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_SENTINEL_NAME: mymaster
      JWT_SECRET: dev-jwt-secret-change-in-production
      ENCRYPTION_KEY: dev-encryption-key-must-be-at-least-32-chars-long
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-token
      OTEL_ENABLED: "true"
    depends_on:
      - pgbouncer
      - kafka-1
      - redis-sentinel-1
    networks:
      edgecloud:
        aliases:
          - task-service
          - node-service
          - scheduler-service-1
          - scheduler-service-2
          - scheduler-service-3
          - websocket-gateway
    ports:
      - 3000:3000
  nginx:
    image: fabiocicerchia/nginx-lua:alpine
    volumes:
      - ../../apps/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../apps/api-gateway/lua:/etc/nginx/lua:ro
    ports:
      - 80:80
    depends_on:
      - backend
    networks:
      - edgecloud
  redis-master:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis-master-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - edgecloud

  redis-replica:
    image: redis:7-alpine
    command: redis-server --replicaof redis-master 6379 --appendonly yes
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - edgecloud

  redis-sentinel-1:
    image: redis:7-alpine
    command: |
      sh -c "echo 'sentinel resolve-hostnames yes
      sentinel monitor mymaster redis-master 6379 2
      sentinel down-after-milliseconds mymaster 5000
      sentinel failover-timeout mymaster 10000' > /sentinel.conf &&
      redis-sentinel /sentinel.conf"
    depends_on:
      - redis-master
      - redis-replica
    networks:
      - edgecloud
    ports:
      - "26379:26379"

  redis-sentinel-2:
    image: redis:7-alpine
    command: |
      sh -c "echo 'sentinel resolve-hostnames yes
      sentinel monitor mymaster redis-master 6379 2
      sentinel down-after-milliseconds mymaster 5000
      sentinel failover-timeout mymaster 10000' > /sentinel.conf &&
      redis-sentinel /sentinel.conf"
    depends_on:
      - redis-master
      - redis-replica
    networks:
      - edgecloud

  redis-sentinel-3:
    image: redis:7-alpine
    command: |
      sh -c "echo 'sentinel resolve-hostnames yes
      sentinel monitor mymaster redis-master 6379 2
      sentinel down-after-milliseconds mymaster 5000
      sentinel failover-timeout mymaster 10000' > /sentinel.conf &&
      redis-sentinel /sentinel.conf"
    depends_on:
      - redis-master
      - redis-replica
    networks:
      - edgecloud
  prometheus:
    image: prom/prometheus:v2.48.0
    volumes:
      - ../../infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - 9090:9090
    networks:
      - edgecloud
  grafana:
    image: grafana/grafana:10.2.0
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../infra/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../infra/observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - 3002:3000
    networks:
      - edgecloud
    depends_on:
      - prometheus
  jaeger:
    image: jaegertracing/all-in-one:1.50
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - 16686:16686
      - 14268:14268
      - 4317:4317
      - 4318:4318
      - 9411:9411
    networks:
      - edgecloud
  loki:
    image: grafana/loki:2.9.2
    ports:
      - 3100:3100
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - edgecloud
  vault:
    image: hashicorp/vault:1.15
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=dev-token
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    volumes:
      - vault-data:/vault/file
    # - ../../infra/vault/vault-config.hcl:/vault/config/vault.hcl:ro
    ports:
      - 8200:8200
    networks:
      - edgecloud
    command: server -dev -dev-root-token-id="dev-token"
  backup-service:
    image: postgres:16-alpine
    volumes:
      - ../../infra/backup:/backup-scripts:ro
      - backup-data:/backups
    command: "sh -c \"\n  echo 'Backup service ready' &&\n  tail -f /dev/null\n\"\n"
    networks:
      - edgecloud
    depends_on:
      - postgres-primary
    environment:
      - BACKUP_SCHEDULE=0 2 * * *
volumes:
  postgres-primary-data: null
  postgres-replica-data: null
  redis-master-data: null
  prometheus-data: null
  grafana-data: null
  vault-data: null
  backup-data: null
networks:
  edgecloud:
    driver: bridge

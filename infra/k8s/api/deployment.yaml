apiVersion: v1
kind: Namespace
metadata:
  name: edge-cloud-orchestrator
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-cloud-config
  namespace: edge-cloud-orchestrator
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  REDIS_SENTINELS: "redis-sentinel:26379"
  REDIS_SENTINEL_NAME: "mymaster"

---
apiVersion: v1
kind: Secret
metadata:
  name: edge-cloud-secrets
  namespace: edge-cloud-orchestrator
type: Opaque
stringData:
  DATABASE_URL: "EXTERNAL_SECRET_REPLACED"
  REDIS_PASSWORD: "EXTERNAL_SECRET_REPLACED"
  RABBITMQ_URL: "EXTERNAL_SECRET_REPLACED"
  JWT_SECRET: "EXTERNAL_SECRET_REPLACED"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: edgecloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: api
          image: ghcr.io/SumitMahajan01/edge-cloud-orchestrator/api:latest
          ports:
            - containerPort: 3090
              name: http
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: edgecloud-secrets
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: edge-cloud-orchestrator
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - port: 3090
      targetPort: 3090
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-agent
  namespace: edge-cloud-orchestrator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: edge-agent
  template:
    metadata:
      labels:
        app: edge-agent
    spec:
      containers:
        - name: edge-agent
          image: edge-cloud-orchestrator/edge-agent:latest
          ports:
            - containerPort: 4001
          env:
            - name: ORCHESTRATOR_URL
              value: "http://backend:3000/api"
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
---
apiVersion: v1
kind: Service
metadata:
  name: edge-agent
  namespace: edge-cloud-orchestrator
spec:
  selector:
    app: edge-agent
  ports:
    - port: 4001
      targetPort: 4001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edge-cloud-ingress
  namespace: edge-cloud-orchestrator
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: api.edge-cloud.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3090
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: edgecloud
data:
  NODE_ENV:               "production"
  LOG_LEVEL:              "info"
  HEARTBEAT_INTERVAL_MS:  "5000"
  NODE_STALE_THRESHOLD_MS: "15000"
  NODE_OFFLINE_THRESHOLD_MS: "30000"
  LEADER_LEASE_TTL_MS:    "15000"
  ML_PREDICTION_TIMEOUT_MS: "50"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: edgecloud
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: ingress
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/component: ingress
    spec:
      containers:
        - name: nginx
          image: ghcr.io/SumitMahajan01/edge-cloud-orchestrator/api-gateway:latest
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-credentials


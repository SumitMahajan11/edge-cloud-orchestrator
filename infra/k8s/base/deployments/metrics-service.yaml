apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-service
  namespace: edgecloud
  labels:
    app.kubernetes.io/name: metrics-service
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metrics-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metrics-service
        app.kubernetes.io/component: observability
    spec:
      containers:
        - name: metrics-service
          image: ghcr.io/SumitMahajan01/edge-cloud-orchestrator/metrics-service:latest
          ports:
            - containerPort: 3005
              name: http
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NODE_ENV
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: edgecloud-secrets
                  key: REDIS_URL
            - name: API_URL
              value: "http://api:3000"
            - name: TASK_SERVICE_URL
              value: "http://task-service:3001"
            - name: NODE_SERVICE_URL
              value: "http://node-service:3002"
            - name: SCHEDULER_SERVICE_URL
              value: "http://scheduler-service:3003"
            - name: WEBSOCKET_GATEWAY_URL
              value: "http://websocket-gateway:3004"
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-credentials

apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-service
  namespace: edgecloud
  labels:
    app.kubernetes.io/name: metrics-service
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metrics-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metrics-service
        app.kubernetes.io/component: observability
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: metrics-service
          image: ghcr.io/SumitMahajan01/edge-cloud-orchestrator/metrics-service:latest
          ports:
            - containerPort: 3005
              name: http
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NODE_ENV
            - name: REDIS_SENTINELS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_SENTINELS
            - name: REDIS_SENTINEL_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_SENTINEL_NAME
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: edgecloud-secrets
                  key: REDIS_PASSWORD
            - name: API_URL
              value: "http://api:3090"
            - name: TASK_SERVICE_URL
              value: "http://task-service:3001"
            - name: NODE_SERVICE_URL
              value: "http://node-service:3002"
            - name: SCHEDULER_SERVICE_URL
              value: "http://scheduler-service:3003"
            - name: WEBSOCKET_GATEWAY_URL
              value: "http://websocket-gateway:3004"
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-credentials

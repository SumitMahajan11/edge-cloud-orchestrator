apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-service
  namespace: edgecloud
  labels:
    app.kubernetes.io/name: node-service
    app.kubernetes.io/component: node-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: node-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-service
        app.kubernetes.io/component: node-manager
    spec:
      containers:
        - name: node-service
          image: ghcr.io/SumitMahajan01/edge-cloud-orchestrator/node-service:latest
          ports:
            - containerPort: 3002
              name: http
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: edgecloud-secrets
                  key: DATABASE_URL
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-credentials


apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
  namespace: edgecloud
  labels:
    app.kubernetes.io/name: task-service
    app.kubernetes.io/component: task-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: task-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: task-service
        app.kubernetes.io/component: task-manager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: task-service
                topologyKey: kubernetes.io/hostname
      containers:
        - name: task-service
          image: ghcr.io/SumitMahajan01/edge-cloud-orchestrator/task-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: edgecloud-secrets
                  key: DATABASE_URL
            - name: REDIS_SENTINELS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_SENTINELS
            - name: REDIS_SENTINEL_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_SENTINEL_NAME
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: edgecloud-secrets
                  key: REDIS_PASSWORD
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu:    "200m"
              memory: "256Mi"
            limits:
              cpu:    "1000m"
              memory: "512Mi"
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
      imagePullSecrets:
        - name: ghcr-credentials


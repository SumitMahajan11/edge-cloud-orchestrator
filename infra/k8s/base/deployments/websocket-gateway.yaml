apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-gateway
  namespace: edgecloud
  labels:
    app.kubernetes.io/name: websocket-gateway
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: websocket-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: websocket-gateway
        app.kubernetes.io/component: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: websocket-gateway
          image: ghcr.io/SumitMahajan01/edge-cloud-orchestrator/websocket-gateway:latest
          ports:
            - containerPort: 3004
              name: ws
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NODE_ENV
            - name: REDIS_SENTINELS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_SENTINELS
            - name: REDIS_SENTINEL_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_SENTINEL_NAME
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: edgecloud-secrets
                  key: REDIS_PASSWORD
          startupProbe:
            httpGet:
              path: /health/startup
              port: ws
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: ws
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: ws
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-credentials


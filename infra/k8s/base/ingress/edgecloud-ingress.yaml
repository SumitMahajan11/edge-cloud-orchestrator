apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edgecloud-ingress

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.edgecloud.io
      secretName: edgecloud-tls
  rules:
    - host: api.edgecloud.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: scheduler-pdb
  namespace: edgecloud
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: task-pdb
  namespace: edgecloud
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: task-service

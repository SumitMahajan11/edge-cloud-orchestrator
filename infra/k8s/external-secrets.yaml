apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: edgecloud
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        # Using Kubernetes auth for production pods
        kubernetes:
          mountPath: "kubernetes"
          role: "edgecloud-service"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cockroachdb-credentials
  namespace: edgecloud
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: cockroachdb-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: database/crdb
        property: username
    - secretKey: password
      remoteRef:
        key: database/crdb
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jwt-secrets
  namespace: edgecloud
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: jwt-secrets
    creationPolicy: Owner
  data:
    - secretKey: secret
      remoteRef:
        key: auth/jwt
        property: private_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: edgecloud-secrets
  namespace: edgecloud
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: edgecloud-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: database/prod
        property: url
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: redis/prod
        property: password
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: security/prod
        property: encryption_key

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-policy
  namespace: edgecloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent
  policyTypes:
    - Egress
  egress:
    # Allow agents to call API service
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api
      ports:
        - protocol: TCP
          port: 3090
    # Explicitly deny Postgres/Redis (already denied by default-deny, but good for documentation)

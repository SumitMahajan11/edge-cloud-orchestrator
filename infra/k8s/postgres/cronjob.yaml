apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-diff
  namespace: edge-cloud-orchestrator
spec:
  schedule: "0 */6 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: pgbackrest
              image: pgbackrest/pgbackrest:latest
              command:
                - pgbackrest
                - --stanza=main
                - --type=diff
                - backup
              volumeMounts:
                - name: pgbackrest-config
                  mountPath: /etc/pgbackrest/pgbackrest.conf
                  subPath: pgbackrest.conf
          restartPolicy: OnFailure
          volumes:
            - name: pgbackrest-config
              configMap:
                name: postgres-pgbackrest-config

apiVersion: v1
kind: Service
metadata:
  name: postgres-primary
  namespace: edge-cloud-orchestrator
spec:
  selector:
    app: postgres
    statefulset.kubernetes.io/pod-name: postgres-0
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-replica
  namespace: edge-cloud-orchestrator
spec:
  selector:
    app: postgres
    # Note: Includes primary too unless pods are labeled. 
    # For read scaling, this is often acceptable.
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: edge-cloud-orchestrator
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: edge-cloud-orchestrator
spec:
  serviceName: postgres
  replicas: 2
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: init-replica
          image: bitnami/postgresql:16
          env:
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POSTGRESQL_REPLICATION_PASSWORD
              value: "repl_password"
          command:
            - /bin/bash
            - -c
            - |
              set -e
              export MY_POD_INDEX=${MY_POD_NAME##*-}
              if [ "$MY_POD_INDEX" -gt "0" ]; then
                echo "Replica pod detected (Index: $MY_POD_INDEX), checking if data exists..."
                if [ ! -d "/bitnami/postgresql/data/base" ]; then
                  echo "No data found, syncing with primary postgres-0.postgres..."
                  until pg_isready -h postgres-0.postgres -p 5432; do
                    echo "Waiting for primary to be ready..."
                    sleep 2
                  done
                  PGPASSWORD=$POSTGRESQL_REPLICATION_PASSWORD pg_basebackup -h postgres-0.postgres -D /bitnami/postgresql/data -U replicator -v -P --wal-method=stream
                else
                  echo "Data already exists, skipping sync."
                fi
              fi
          volumeMounts:
            - name: postgres-data
              mountPath: /bitnami/postgresql
      containers:
        - name: postgres
          image: bitnami/postgresql:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_USERNAME
              value: "postgres"
            - name: POSTGRESQL_PASSWORD
              value: "postgres"
            - name: POSTGRESQL_DATABASE
              value: "edge_cloud"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POSTGRESQL_REPLICATION_USER
              value: "replicator"
            - name: POSTGRESQL_REPLICATION_PASSWORD
              value: "repl_password"
          command:
            - /bin/bash
            - -c
            - |
              export MY_POD_INDEX=${POD_NAME##*-}
              if [ "$MY_POD_INDEX" -eq "0" ]; then
                export POSTGRES_REPLICATION_MODE=master
                export POSTGRESQL_REPLICATION_MODE=master
              else
                export POSTGRES_REPLICATION_MODE=slave
                export POSTGRESQL_REPLICATION_MODE=slave
                export POSTGRES_MASTER_HOST=postgres-0.postgres
                export POSTGRESQL_MASTER_HOST=postgres-0.postgres
              fi
              # Support both standard and Bitnami environment variables
              /opt/bitnami/scripts/postgresql/entrypoint.sh /opt/bitnami/scripts/postgresql/run.sh
          volumeMounts:
            - name: postgres-data
              mountPath: /bitnami/postgresql
            - name: postgres-config
              mountPath: /opt/bitnami/postgresql/conf/conf.d
      volumes:
        - name: postgres-config
          configMap:
            name: postgres-config
            items:
              - key: postgresql.conf
                path: 10-ha.conf
              - key: pg_hba.conf
                path: pg_hba.conf
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

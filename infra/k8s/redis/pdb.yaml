apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-sentinel-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: redis
      role: sentinel
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-replica-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: redis
      role: replica

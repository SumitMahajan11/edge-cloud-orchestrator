apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: default
spec:
  ports:
    - port: 6379
      targetPort: redis
      name: redis
  selector:
    app: redis
    role: master
---
apiVersion: v1
kind: Service
metadata:
  name: redis-replica
  namespace: default
spec:
  ports:
    - port: 6379
      targetPort: redis
      name: redis
  selector:
    app: redis
    role: replica
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  namespace: default
spec:
  ports:
    - port: 26379
      targetPort: sentinel
      name: sentinel
  selector:
    app: redis
    role: sentinel
---
apiVersion: v1
kind: Service
metadata:
  name: redis-nodes
  namespace: default
spec:
  clusterIP: None
  ports:
    - port: 6379
      name: redis
    - port: 26379
      name: sentinel
  selector:
    app: redis

global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "alerts@edgecloud.io"
  smtp_auth_username: "${SMTP_USERNAME}"
  smtp_auth_password: "${SMTP_PASSWORD}"
  slack_api_url: "${SLACK_WEBHOOK_URL}"
  pagerduty_url: "https://events.pagerduty.com/v2/enqueue"

templates:
  - "/etc/alertmanager/templates/*.tmpl"

route:
  group_by: ["alertname", "severity", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"
  routes:
    - match:
        severity: critical
      receiver: "pagerduty-critical"
      continue: true
    - match:
        severity: warning
      receiver: "slack-warnings"
    - match:
        service: edge-agent
      receiver: "edge-team"
    - match:
        alertname: NodeDown
      receiver: "node-alerts"
    - match:
        alertname: TaskFailureRate
      receiver: "task-alerts"

receivers:
  - name: "default"
    email_configs:
      - to: "oncall@edgecloud.io"
        send_resolved: true
        subject: "[EdgeCloud Alert] {{ .GroupLabels.alertname }}"
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Severity: {{ .Labels.severity }}
          Service: {{ .Labels.service }}
          Details: {{ .Annotations.description }}
          {{ end }}

  - name: "pagerduty-critical"
    pagerduty_configs:
      - service_key: "${PAGERDUTY_SERVICE_KEY}"
        severity: critical
        description: "{{ .GroupLabels.alertname }}"
        details:
          firing: '{{ template "pagerduty.default.description" . }}'
    email_configs:
      - to: "${ALERT_EMAIL_CRITICAL}"
        send_resolved: true
        subject: "[CRITICAL] {{ .GroupLabels.alertname }}"
    slack_configs:
      - channel: "#critical-alerts"
        send_resolved: true
        title: "{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}"
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}
          *Severity:* {{ .Labels.severity }}
          *Description:* {{ .Annotations.description }}
          *Details:*
          {{ range .Labels.SortedPairs }} • *{{ .Name }}:* {{ .Value }}
          {{ end }}
          {{ end }}

  - name: "slack-warnings"
    email_configs:
      - to: "${ALERT_EMAIL_WARNING}"
        send_resolved: true
    slack_configs:
      - channel: "#edgecloud-alerts"
        send_resolved: true
        title: "{{ .GroupLabels.alertname }}"
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}

  - name: "edge-team"
    slack_configs:
      - channel: "#edge-agents"
        send_resolved: true
        title: "Edge Agent Alert: {{ .GroupLabels.alertname }}"
        text: "{{ .Annotations.description }}"

  - name: "node-alerts"
    webhook_configs:
      - url: "${API_URL}/api/webhooks/alerts/nodes"
        send_resolved: true

  - name: "task-alerts"
    webhook_configs:
      - url: "${API_URL}/api/webhooks/alerts/tasks"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "service"]

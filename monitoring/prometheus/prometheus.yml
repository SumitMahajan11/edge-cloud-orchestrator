global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: edgecloud

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # EdgeCloud Aggregated Metrics (from Infra)
  - job_name: 'edgecloud-aggregated'
    static_configs:
      - targets: ['metrics-service:3005']
    scrape_interval: 10s
    scrape_timeout: 5s

  # EdgeCloud Orchestrator (from Cloud1)
  - job_name: 'edge-cloud-orchestrator'
    static_configs:
      - targets: ['orchestrator:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Edge Agents (from Cloud1)
  - job_name: 'edge-agents'
    static_configs:
      - targets: ['edge-agent-1:4001', 'edge-agent-2:4002', 'edge-agent-3:4003']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Infrastructure (Merged)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s

  # Backend Services (from Infra)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 15s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s

  - job_name: 'vault'
    static_configs:
      - targets: ['vault:8200']
    metrics_path: /v1/sys/metrics
    params:
      format: ['prometheus']
    scrape_interval: 15s

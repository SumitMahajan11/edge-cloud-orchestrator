components:
  schemas:
    def-0:
      additionalProperties: false
      properties:
        error:
          additionalProperties: false
          properties:
            code:
              description: Machine-readable error code
              type: string
            details:
              description: Optional error details
            message:
              description: Human-readable error description
              type: string
            requestId:
              description: Unique request ID
              type: string
            stack:
              description: Error stack trace (non-production only)
              type: string
            timestamp:
              description: ISO 8601 timestamp
              format: date-time
              type: string
          required:
            - code
            - message
          type: object
      required:
        - error
      title: ErrorSchema
      type: object
    def-1:
      additionalProperties: false
      properties:
        checks:
          additionalProperties:
            type: boolean
          type: object
        service:
          type: string
        status:
          enum:
            - degraded
            - healthy
            - unhealthy
          type: string
        timestamp:
          format: date-time
          type: string
        version:
          type: string
      required:
        - service
        - status
        - timestamp
      title: HealthSchema
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  description: Production API documentation for the Edge-Cloud Orchestrator Control Plane
  title: Edge-Cloud Orchestrator API
  version: 1.0.0
openapi: 3.0.3
paths:
  /v2/admin/audit-logs:
    get:
      parameters:
        - in: query
          name: userId
          required: false
          schema:
            type: string
        - in: query
          name: action
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            default: 100
            type: number
      responses:
        "200":
          description: Default Response
      summary: Get audit logs
      tags:
        - admin
  /v2/admin/cleanup:
    post:
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                olderThanDays:
                  minimum: 1
                  type: integer
                types:
                  items:
                    type: string
                  type: array
              required:
                - olderThanDays
                - types
              type: object
        required: true
      responses:
        "200":
          description: Default Response
      summary: Clean up old data
      tags:
        - admin
  /v2/admin/dlq/events:
    get:
      parameters:
        - in: query
          name: topic
          required: false
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            enum:
              - PENDING
              - PERMANENTLY_FAILED
              - REPROCESSED
              - RETRYING
            type: string
        - in: query
          name: limit
          required: false
          schema:
            maximum: 100
            minimum: 1
            type: integer
        - in: query
          name: offset
          required: false
          schema:
            minimum: 0
            type: integer
      responses:
        "200":
          description: Default Response
      summary: List DLQ events with filtering
      tags:
        - admin
  /v2/admin/dlq/events/{id}/retry:
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: Default Response
      summary: Retry a specific DLQ event
      tags:
        - admin
  /v2/admin/dlq/purge:
    post:
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                olderThanDays:
                  type: integer
              type: object
      responses:
        "200":
          description: Default Response
      summary: Purge old DLQ events
      tags:
        - admin
  /v2/admin/dlq/stats:
    get:
      responses:
        "200":
          description: Default Response
      summary: Get DLQ statistics across all streams
      tags:
        - admin
  /v2/admin/events/republish:
    post:
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                entityId:
                  type: string
                eventType:
                  type: string
                targetTopic:
                  type: string
              required:
                - entityId
                - eventType
              type: object
        required: true
      responses:
        "200":
          description: Default Response
      summary: Republish an event to Kafka
      tags:
        - admin
  /v2/admin/events/republish-range:
    post:
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                dryRun:
                  type: boolean
                eventType:
                  type: string
                fromTimestamp:
                  type: string
                toTimestamp:
                  type: string
              required:
                - eventType
                - fromTimestamp
                - toTimestamp
              type: object
        required: true
      responses:
        "200":
          description: Default Response
      summary: Bulk republish events to Kafka
      tags:
        - admin
  /v2/admin/health:
    get:
      responses:
        "200":
          description: Default Response
      summary: Get system health
      tags:
        - admin
  /v2/admin/ml/retrain:
    post:
      responses:
        "200":
          description: Default Response
      summary: Trigger ML model retraining
      tags:
        - admin
  /v2/admin/users:
    get:
      responses:
        "200":
          description: Default Response
      summary: List all users
      tags:
        - admin
  /v2/admin/users/{id}/deactivate:
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: Default Response
      summary: Deactivate user
      tags:
        - admin
  /v2/admin/users/{id}/role:
    patch:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                role:
                  enum:
                    - ADMIN
                    - OPERATOR
                    - SUPER_ADMIN
                    - VIEWER
                  type: string
              required:
                - role
              type: object
        required: true
      responses:
        "200":
          description: Default Response
      summary: Update user role
      tags:
        - admin
  /v2/admin/ws-stats:
    get:
      responses:
        "200":
          description: Default Response
      summary: Get WebSocket statistics
      tags:
        - admin
  /v2/agents/ca:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  certificate:
                    type: string
                type: object
          description: Default Response
      summary: Get CA certificate
      tags:
        - agents
  /v2/agents/certificates/sign:
    post:
      requestBody:
        content:
          application/json:
            schema:
              properties:
                bootstrapToken:
                  description: One-time bootstrap token
                  type: string
                cpuCores:
                  type: number
                csr:
                  description: PEM encoded Certificate Signing Request
                  type: string
                hardwareId:
                  type: string
                ipAddress:
                  type: string
                memoryGB:
                  type: number
                nodeName:
                  type: string
                port:
                  type: number
                region:
                  type: string
                storageGB:
                  type: number
              required:
                - bootstrapToken
                - csr
                - nodeName
                - region
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  caCertificate:
                    type: string
                  certificate:
                    type: string
                  expiresAt:
                    format: date-time
                    type: string
                  nodeId:
                    type: string
                type: object
          description: Default Response
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
          description: Default Response
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
          description: Default Response
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
          description: Default Response
      summary: Bootstrap agent certificate and register node
      tags:
        - agents
  /v2/agents/heartbeat:
    post:
      requestBody:
        content:
          application/json:
            schema:
              properties:
                metrics:
                  properties:
                    cpu_usage:
                      type: number
                    memory_usage:
                      type: number
                  type: object
                status:
                  type: string
                timestamp:
                  type: number
              type: object
      responses:
        "200":
          description: Default Response
      summary: Agent heartbeat
      tags:
        - agents
  /v2/agents/tasks/pending:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  cpu_fuel:
                    nullable: true
                    type: number
                  image:
                    type: string
                  input:
                    additionalProperties: true
                    type: object
                  memory_limit_mb:
                    type: number
                  runtime:
                    type: string
                  task_id:
                    type: string
                  timeout_seconds:
                    type: number
                  wasm_artifact_id:
                    nullable: true
                    type: string
                type: object
          description: Default Response
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
          description: Default Response
      summary: Poll for pending tasks
      tags:
        - agents
  /v2/agents/tasks/{taskId}/result:
    post:
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                duration_ms:
                  type: number
                error:
                  nullable: true
                  type: string
                exit_code:
                  type: number
                metrics:
                  properties:
                    cpu_usage_avg:
                      type: number
                    memory_usage_max:
                      type: number
                    network_egress_bytes:
                      type: number
                    network_ingress_bytes:
                      type: number
                  type: object
                status:
                  type: string
                stderr:
                  type: string
                stdout:
                  type: string
              required:
                - exit_code
                - status
              type: object
        required: true
      responses:
        "200":
          description: Default Response
      summary: Report task result
      tags:
        - agents
  /v2/agents/tasks/{taskId}/status:
    post:
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                status:
                  type: string
              required:
                - status
              type: object
        required: true
      responses:
        "200":
          description: Default Response
      summary: Update task execution status
      tags:
        - agents
  /v2/alerts/:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  alerts:
                    items:
                      properties:
                        acknowledgedAt:
                          nullable: true
                          type: string
                        description:
                          type: string
                        firedAt:
                          type: string
                        id:
                          type: string
                        resolvedAt:
                          nullable: true
                          type: string
                        severity:
                          enum:
                            - CRITICAL
                            - HIGH
                            - LOW
                            - MEDIUM
                          type: string
                        source:
                          type: string
                        title:
                          type: string
                      type: object
                    type: array
                type: object
          description: Default Response
      summary: Get active alerts for tenant
      tags:
        - alerts
  /v2/alerts/test:
    post:
      requestBody:
        content:
          application/json:
            schema:
              properties:
                description:
                  type: string
                severity:
                  enum:
                    - CRITICAL
                    - HIGH
                    - LOW
                    - MEDIUM
                  type: string
                title:
                  type: string
              required:
                - description
                - severity
                - title
              type: object
        required: true
      responses:
        "200":
          description: Default Response
      summary: Send test alert
      tags:
        - alerts
  /v2/alerts/{id}/acknowledge:
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Default Response
      summary: Acknowledge an alert
      tags:
        - alerts
  /v2/analytics/cost:
    get:
      parameters:
        - in: query
          name: from
          required: false
          schema:
            format: date-time
            type: string
        - in: query
          name: to
          required: false
          schema:
            format: date-time
            type: string
        - in: query
          name: nodeId
          required: false
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  costByNode:
                    items:
                      properties:
                        cost:
                          type: number
                        nodeId:
                          type: string
                        nodeName:
                          type: string
                        taskCount:
                          type: number
                      type: object
                    type: array
                  costOverTime:
                    items:
                      properties:
                        cost:
                          type: number
                        date:
                          type: string
                      type: object
                    type: array
                  totalActualCost:
                    type: number
                  totalSavings:
                    type: number
                type: object
          description: Default Response
      summary: Get cost analytics
      tags:
        - analytics
  /v2/api-keys/:
    get:
      responses:
        "200":
          description: Default Response
      summary: List my API keys
      tags:
        - api-keys
    post:
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                expiresAt:
                  anyOf:
                    - anyOf:
                        - not: {}
                        - format: date-time
                          type: string
                    - type: "null"
                name:
                  maxLength: 100
                  minLength: 1
                  pattern: ^[a-zA-Z0-9\s\-_]+$
                  type: string
                permissions:
                  items:
                    type: string
                  type: array
              required:
                - name
              type: object
        required: true
      responses:
        "200":
          description: Default Response
      summary: Create a new API key
      tags:
        - api-keys
  /v2/api-keys/{id}:
    delete:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: Default Response
      summary: Revoke an API key
      tags:
        - api-keys
  /v2/auth/login:
    post:
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                email:
                  format: email
                  type: string
                password:
                  minLength: 1
                  type: string
              required:
                - email
                - password
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  accessToken:
                    type: string
                  expiresAt:
                    format: date-time
                    type: string
                  refreshToken:
                    type: string
                  token:
                    type: string
                  user:
                    additionalProperties: false
                    properties:
                      email:
                        format: email
                        type: string
                      id:
                        format: uuid
                        type: string
                      name:
                        anyOf:
                          - anyOf:
                              - not: {}
                              - type: string
                          - type: "null"
                      role:
                        type: string
                    required:
                      - email
                      - id
                      - role
                    type: object
                required:
                  - accessToken
                  - expiresAt
                  - refreshToken
                  - token
                  - user
                type: object
          description: Default Response
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
          description: Default Response
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
          description: Default Response
      summary: Login and get tokens
      tags:
        - auth
  /v2/auth/logout:
    post:
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                type: object
          description: Default Response
      summary: Logout and invalidate session
      tags:
        - auth
  /v2/auth/me:
    get:
      responses:
        "200":
          description: Default Response
      summary: Get current user profile
      tags:
        - auth
  /v2/auth/refresh:
    post:
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                refreshToken:
                  minLength: 1
                  type: string
              required:
                - refreshToken
              type: object
        required: true
      responses:
        "200":
          description: Default Response
      summary: Refresh access token
      tags:
        - auth
  /v2/auth/register:
    post:
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                email:
                  format: email
                  type: string
                name:
                  maxLength: 100
                  minLength: 2
                  pattern: ^[a-zA-Z\s\-\.]+$
                  type: string
                password:
                  maxLength: 128
                  minLength: 12
                  type: string
              required:
                - email
                - name
                - password
              type: object
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  accessToken:
                    type: string
                  expiresAt:
                    format: date-time
                    type: string
                  refreshToken:
                    type: string
                  token:
                    type: string
                  user:
                    additionalProperties: false
                    properties:
                      email:
                        format: email
                        type: string
                      id:
                        format: uuid
                        type: string
                      name:
                        anyOf:
                          - anyOf:
                              - not: {}
                              - type: string
                          - type: "null"
                      role:
                        type: string
                    required:
                      - email
                      - id
                      - role
                    type: object
                required:
                  - accessToken
                  - expiresAt
                  - refreshToken
                  - token
                  - user
                type: object
          description: Default Response
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
          description: Default Response
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
          description: Default Response
      summary: Register a new user
      tags:
        - auth
  /v2/auth/sessions:
    delete:
      responses:
        "200":
          description: Default Response
      summary: Revoke all user sessions (logout everywhere)
      tags:
        - auth
    get:
      responses:
        "200":
          description: Default Response
      summary: List active user sessions
      tags:
        - auth
  /v2/auth/sessions/{id}:
    delete:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: Default Response
      summary: Revoke a specific session
      tags:
        - auth
  /v2/carbon/by-region:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  properties:
                    carbonIntensityGco2:
                      type: number
                    lastUpdatedAt:
                      type: string
                    source:
                      type: string
                    zone:
                      type: string
                  type: object
                type: array
          description: Default Response
      summary: Get carbon breakdown by region
      tags:
        - carbon
  /v2/carbon/intensity:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  regions:
                    items:
                      properties:
                        carbonIntensityGco2:
                          type: number
                        lastUpdatedAt:
                          type: string
                        source:
                          type: string
                        zone:
                          type: string
                      type: object
                    type: array
                type: object
          description: Default Response
      summary: Get regional carbon intensity
      tags:
        - carbon
  /v2/carbon/policy:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  activePolicy:
                    type: string
                  carbonWeight:
                    type: number
                  isActive:
                    type: boolean
                type: object
          description: Default Response
      summary: Get active carbon optimization policy
      tags:
        - carbon
    patch:
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                carbonWeight:
                  maximum: 1
                  minimum: 0
                  type: number
              required:
                - carbonWeight
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  carbonWeight:
                    type: number
                  success:
                    type: boolean
                type: object
          description: Default Response
      summary: Update carbon optimization weight
      tags:
        - carbon
  /v2/carbon/report:
    get:
      parameters:
        - in: query
          name: from
          required: false
          schema:
            format: date-time
            type: string
        - in: query
          name: to
          required: false
          schema:
            format: date-time
            type: string
        - in: query
          name: tenantId
          required: false
          schema:
            format: uuid
            type: string
        - in: query
          name: format
          required: false
          schema:
            default: json
            enum:
              - csv
              - json
            type: string
      responses:
        "200":
          description: Default Response
      summary: Get auditable tenant carbon report
      tags:
        - carbon
  /v2/carbon/savings:
    get:
      parameters:
        - in: query
          name: days
          required: false
          schema:
            default: 7
            maximum: 365
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  equivalentTreesPlanted:
                    type: number
                  savingsHistory:
                    items:
                      properties:
                        date:
                          type: string
                        savedGco2:
                          type: number
                      type: object
                    type: array
                  totalSavedGco2Today:
                    type: number
                  totalSavedGco2Week:
                    type: number
                type: object
          description: Default Response
      summary: Get carbon savings metrics
      tags:
        - carbon
  /v2/carbon/summary:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  equivalentTreesPlanted:
                    type: number
                  totalSavedGco2Today:
                    type: number
                  totalSavedGco2Week:
                    type: number
                type: object
          description: Default Response
      summary: Get carbon footprint summary
      tags:
        - carbon
  /v2/circuit-breakers/:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  properties:
                    failureCount:
                      type: number
                    failureRate:
                      type: number
                    lastStateChange:
                      type: string
                    name:
                      type: string
                    nextRetryAt:
                      type: string
                    state:
                      enum:
                        - CLOSED
                        - HALF_OPEN
                        - OPEN
                      type: string
                    successCount:
                      type: number
                  type: object
                type: array
          description: Default Response
      summary: Get all circuit breaker states
      tags:
        - resilience
  /v2/circuit-breakers/{name}/reset:
    post:
      parameters:
        - in: path
          name: name
          required: true
          schema:
            minLength: 1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                  success:
                    type: boolean
                type: object
          description: Default Response
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/def-0"
          description: Default Response
      summary: Force reset a circuit breaker
      tags:
        - resilience
  /v2/cost/by-node:
    get:
      responses:
        "200":
          description: Default Response
      summary: Get cost breakdown by node
      tags:
        - cost
  /v2/cost/projections:
    get:
      responses:
        "200":
          description: Default Response
      summary: Get cost projections
      tags:
        - cost
  /v2/cost/records:
    get:
      parameters:
        - in: query
